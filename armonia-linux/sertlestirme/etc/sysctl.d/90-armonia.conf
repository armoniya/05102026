# Armonia kiosk cekirdek ayarlari. Kaynak: Kicksecure security-misc secimi + Gemini taslagi,
# Claude tarafindan ayiklandi (2026-11-14). Her satirin gerekcesi yanindadir.

# Paylasimli dizinlerde symlink/hardlink/FIFO yaris saldirilari
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# setuid sureclerin bellek dokumu alinmaz (PIN/anahtar bellekte olabilir)
fs.suid_dumpable = 0

# Cekirdek adresleri, dmesg, perf: yetkisiz okuma kapali
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
# Yetkisiz eBPF kapali, BPF JIT sertlestirme
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# ptrace yalniz CAP_SYS_PTRACE ile (kiosk'ta hata ayiklayici yok)
kernel.yama.ptrace_scope = 2
# Calisan sistemden yeni cekirdek yuklenemez
kernel.kexec_load_disabled = 1
# Klavyeden Magic SysRq kapali (fiziksel erisimle sistem dusurulmesin)
kernel.sysrq = 0
# io_uring kapali: uygulama (tokio/epoll) kullanmiyor, sik cekirdek acigi kaynagi
kernel.io_uring_disabled = 2
# Yetkisiz userfaultfd kapali
vm.unprivileged_userfaultfd = 0
# Eski TTY satir disiplini modulleri otomatik yuklenmez
dev.tty.ldisc_autoload = 0

# Ag: SYN cerezleri, RFC1337, ters yol filtresi, yonlendirme/kaynak-yonlendirme reddi
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# 50-default.conf arayuzlere 2 (gevsek) yaziyor; etkin deger max(all,arayuz) oldugundan arayuzler de 1
net.ipv4.conf.*.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# accept_ra: systemd-networkd RA'yi kendisi isler, cekirdek ayarina dokunulmadi
# ASLR entropisi
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
