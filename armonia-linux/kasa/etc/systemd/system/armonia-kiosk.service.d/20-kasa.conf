# Kasa varsa acilmasini bekle (parola Plymouth'ta); yoksa beklemeden basla. Claude, 2026-11-14.
[Unit]
After=systemd-cryptsetup@kasa.service armonia-kasa-bagla.service armonia-postgresql.service
Wants=armonia-kasa-bagla.service armonia-postgresql.service

[Service]
# Sunucu rolunde PostgreSQL hazirsa DATABASE_URL (yoksa uygulama kasadaki SQLite/dosya deposunu kullanir)
EnvironmentFile=-/run/armonia/cokluuyap.env
# Kasa durumu /run/armonia/kasa-durum (bagli | yok | HATA); kiosk her durumda acilir
ExecStartPre=+/opt/armonia/bin/kasa_denetle.sh
